name: Release

# 打 tag 即发版：构建签名包 → 校验签名 → 上传到 GitHub Release。
# 需要以下 repository secrets 才能产出可覆盖升级的正式包：
#   JKTV_KEYSTORE_BASE64   签名库文件（base64 -w0 release.jks 的结果）
#   JKTV_STORE_PASSWORD    签名库口令
#   JKTV_KEY_ALIAS         密钥别名
#   JKTV_KEY_PASSWORD      密钥口令
# 四个 secret 缺任意一个时，只构建 debug 包并标注为「未签名」，不会误发正式包。

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.JKTV_KEYSTORE_BASE64 }}
      JKTV_STORE_PASSWORD: ${{ secrets.JKTV_STORE_PASSWORD }}
      JKTV_KEY_ALIAS: ${{ secrets.JKTV_KEY_ALIAS }}
      JKTV_KEY_PASSWORD: ${{ secrets.JKTV_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.9'

      - name: 校验 tag 与 versionName 一致
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(grep -oP "versionName\s+['\"]\K[^'\"]+" app/build.gradle)
          echo "tag=$TAG  versionName=$VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 app/build.gradle 的 versionName $VERSION 不一致"
            exit 1
          fi

      - name: 还原签名密钥
        id: keystore
        if: env.KEYSTORE_B64 != ''
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"

      - name: 构建正式包
        if: steps.keystore.outputs.path != ''
        env:
          JKTV_KEYSTORE: ${{ runner.temp }}/release.jks
        run: gradle --no-daemon :app:assembleRelease

      - name: 构建 debug 包（未配置签名时）
        if: steps.keystore.outputs.path == ''
        run: |
          echo "::warning::未配置签名 secrets，本次只构建 debug 包"
          gradle --no-daemon :app:assembleDebug

      - name: 校验签名与产物
        run: |
          set -e
          if [ "${{ steps.keystore.outputs.path }}" != "" ]; then
            APK=app/build/outputs/apk/release/app-release.apk
            BT="$ANDROID_HOME/build-tools/34.0.0"
            "$BT/apksigner" verify -v --print-certs "$APK" | grep -E 'Verifies|Signer #1 certificate DN|Number of signers'
            # Android 6 只认 v1(JAR) 签名，缺了老机型装不上
            "$BT/apksigner" verify -v "$APK" | grep -q 'Verified using v1 scheme (JAR signing): true' \
              || { echo "::error::缺少 v1 签名方案，Android 6 无法安装"; exit 1; }
            NAME="JKTV-${GITHUB_REF_NAME#v}.apk"
          else
            APK=app/build/outputs/apk/debug/app-debug.apk
            NAME="JKTV-${GITHUB_REF_NAME#v}-debug.apk"
          fi
          mkdir -p out
          cp "$APK" "out/$NAME"
          ( cd out && sha256sum "$NAME" | tee SHA256SUMS.txt )
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"

      - name: 发布
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # annotated tag 用其附注作为更新说明，轻量 tag 退回按提交生成
          if git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | grep -q .; then
            NOTES=--notes-from-tag
          else
            NOTES=--generate-notes
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "out/$APK_NAME" out/SHA256SUMS.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" $NOTES \
              "out/$APK_NAME" out/SHA256SUMS.txt
          fi
