plugins { id 'com.android.application' }

android {
    namespace 'com.jktv.launcher'
    compileSdk 34
    defaultConfig {
        applicationId 'com.jktv.launcher'
        minSdk 23
        targetSdk 34
        versionCode 12
        versionName '0.4.6'
    }
    signingConfigs {
        release {
            if (System.getenv('JKTV_KEYSTORE')) {
                storeFile file(System.getenv('JKTV_KEYSTORE'))
                storePassword System.getenv('JKTV_STORE_PASSWORD')
                keyAlias System.getenv('JKTV_KEY_ALIAS') ?: 'jktv'
                keyPassword System.getenv('JKTV_KEY_PASSWORD') ?: System.getenv('JKTV_STORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv('JKTV_KEYSTORE')) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // Android 6.0 (API 23) lacks Java 8 interface defaults such as
        // Map.putIfAbsent / List.sort / Collection.removeIf, so rewrite them.
        coreLibraryDesugaringEnabled true
    }
}
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    testImplementation 'junit:junit:4.13.2'
}
